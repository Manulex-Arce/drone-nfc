<!DOCTYPE html>

<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DJI Neo 2 encontrado</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f4f6f8;

            color: #202124;

            padding: 20px;
        }


        .card {

            width: 100%;

            max-width: 430px;

            background: white;

            border-radius: 24px;

            padding: 32px 25px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12);
        }


        .drone {

            font-size: 64px;

            margin-bottom: 10px;
        }


        h1 {

            margin: 0 0 10px;

            font-size: 27px;
        }


        h3 {

            margin: 0 0 12px;

            font-size: 17px;

            font-weight: 600;
        }


        .subtitle {

            margin: 0 auto 25px;

            color: #666;

            line-height: 1.5;
        }


        .status {

            padding: 16px;

            border-radius: 14px;

            background: #f1f3f4;

            margin-bottom: 15px;

            line-height: 1.4;
        }


        .coordinates {

            display: none;

            margin: 15px 0;

            padding: 12px;

            border-radius: 10px;

            background: #f8f9fa;

            font-size: 13px;

            color: #666;

            word-break: break-word;
        }


        .tag-id {

            margin-top: 15px;

            font-size: 11px;

            color: #aaa;
        }


        button {

            width: 100%;

            padding: 16px;

            border: 0;

            border-radius: 14px;

            background: #25D366;

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;
        }


        button:disabled {

            background: #b7b7b7;

            cursor: not-allowed;
        }


        .privacy {

            margin-top: 20px;

            font-size: 12px;

            line-height: 1.5;

            color: #888;
        }


        .retry {

            margin-top: 10px;

            background: #555;

            display: none;
        }

    </style>

</head>


<body>


<main class="card">


    <div class="drone">
        🛸
    </div>


    <h1>
        DJI Neo 2 encontrado
    </h1>


    <h3>
        Propiedad de Manuel Alexander Arce Ramos
    </h3>


    <p class="subtitle">
        Si encontraste este drone, puedes avisar
        al propietario directamente por WhatsApp.
    </p>


    <div
        id="status"
        class="status"
    >
        📍 Obteniendo tu ubicación...
    </div>


    <div
        id="coordinates"
        class="coordinates"
    ></div>


    <button
        id="whatsappButton"
        disabled
    >
        Abrir WhatsApp
    </button>


    <button
        id="retryButton"
        class="retry"
    >
        Intentar nuevamente
    </button>


    <div
        id="tagIdElement"
        class="tag-id"
    ></div>


    <p class="privacy">
        Tu ubicación se utiliza para facilitar
        la recuperación del drone.
    </p>


</main>



<script>


    /*
     * ============================================================
     * CONFIGURACIÓN
     * ============================================================
     */


    /*
     * WhatsApp del propietario.
     *
     * El Salvador:
     * 503 + número
     *
     * Sin +
     * Sin espacios
     * Sin guiones
     */

    const WHATSAPP_NUMBER =
        "50370163917";


    /*
     * Mensaje inicial de WhatsApp.
     */

    const BASE_MESSAGE =
        "¡Encontré tu DJI Neo 2! 🛸";


    /*
     * ============================================================
     * GOOGLE APPS SCRIPT
     * ============================================================
     */

    const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwLpbcRR0dwFamGKl3BspyuMPBjJQXasgDZ0uX6cHZvGCAlbxpoxzqOvRElV0MGcUbc/exec";


    /*
     * ============================================================
     * OBTENER ID DEL NFC
     * ============================================================
     *
     * URL:
     *
     * https://manulex-arce.github.io/drone-nfc/?id=NEO2-001
     *
     * Resultado:
     *
     * tagId = "NEO2-001"
     */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const tagId =
        urlParams.get("id") ||
        "SIN-ID";


    /*
     * ============================================================
     * CREAR SCAN ID
     * ============================================================
     *
     * Este ID identifica UNA apertura concreta.
     *
     * Ejemplo:
     *
     * mfw3kabc-8x2k4p9q
     *
     * Se manda tanto al registrar el escaneo
     * como al actualizar la ubicación.
     */

    const scanId =
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 10);


    /*
     * ============================================================
     * ELEMENTOS HTML
     * ============================================================
     */

    const statusElement =
        document.getElementById(
            "status"
        );


    const coordinatesElement =
        document.getElementById(
            "coordinates"
        );


    const whatsappButton =
        document.getElementById(
            "whatsappButton"
        );


    const retryButton =
        document.getElementById(
            "retryButton"
        );


    const tagIdElement =
        document.getElementById(
            "tagIdElement"
        );


    /*
     * ============================================================
     * MOSTRAR ID DEL NFC
     * ============================================================
     */

    tagIdElement.textContent =
        "Identificador: " +
        tagId;


    /*
     * ============================================================
     * VARIABLES GPS
     * ============================================================
     */

    let latitude = null;

    let longitude = null;


    /*
     * ============================================================
     * REGISTRAR ESCANEO
     * ============================================================
     *
     * ESTOS SON EXACTAMENTE LOS PARÁMETROS
     * QUE ESPERA TU Code.gs:
     *
     * action
     * id
     * ua
     * scan_id
     *
     * NO se utiliza:
     *
     * nfc_id
     * user_agent
     *
     * ============================================================
     */

    function registrarEscaneo() {


        const params =
            new URLSearchParams();


        params.set(
            "action",
            "scan"
        );


        params.set(
            "id",
            tagId
        );


        params.set(
            "ua",
            navigator.userAgent
        );


        params.set(
            "scan_id",
            scanId
        );


        const url =
            APPS_SCRIPT_URL +
            "?" +
            params.toString();


        console.log(
            "================================"
        );

        console.log(
            "REGISTRANDO ESCANEO"
        );

        console.log(
            "URL:",
            url
        );

        console.log(
            "action:",
            "scan"
        );

        console.log(
            "id:",
            tagId
        );

        console.log(
            "ua:",
            navigator.userAgent
        );

        console.log(
            "scan_id:",
            scanId
        );

        console.log(
            "================================"
        );


        /*
         * Usamos Image para enviar la petición
         * sin depender de CORS.
         */

        const img =
            new Image();


        img.src =
            url;

    }


    /*
     * ============================================================
     * ACTUALIZAR UBICACIÓN
     * ============================================================
     *
     * ESTOS SON EXACTAMENTE LOS PARÁMETROS
     * QUE ESPERA TU Code.gs:
     *
     * action
     * scan_id
     * lat
     * lon
     *
     * ============================================================
     */

    function actualizarUbicacion(
        lat,
        lon
    ) {


        const params =
            new URLSearchParams();


        params.set(
            "action",
            "location"
        );


        params.set(
            "scan_id",
            scanId
        );


        params.set(
            "lat",
            lat
        );


        params.set(
            "lon",
            lon
        );


        const url =
            APPS_SCRIPT_URL +
            "?" +
            params.toString();


        console.log(
            "================================"
        );

        console.log(
            "ACTUALIZANDO UBICACIÓN"
        );

        console.log(
            "URL:",
            url
        );

        console.log(
            "action:",
            "location"
        );

        console.log(
            "scan_id:",
            scanId
        );

        console.log(
            "lat:",
            lat
        );

        console.log(
            "lon:",
            lon
        );

        console.log(
            "================================"
        );


        /*
         * Enviar petición.
         */

        const img =
            new Image();


        img.src =
            url;

    }


    /*
     * ============================================================
     * OBTENER UBICACIÓN
     * ============================================================
     */

    function obtenerUbicacion() {


        if (
            !navigator.geolocation
        ) {

            mostrarError(
                "Este navegador no permite obtener la ubicación."
            );

            return;
        }


        statusElement.innerHTML =
            "📍 Solicitando tu ubicación...";


        retryButton.style.display =
            "none";


        navigator.geolocation.getCurrentPosition(


            /*
             * ====================================================
             * GPS OBTENIDO
             * ====================================================
             */

            function(position) {


                latitude =
                    position.coords.latitude;


                longitude =
                    position.coords.longitude;


                console.log(
                    "================================"
                );

                console.log(
                    "GPS OBTENIDO"
                );

                console.log(
                    "Latitude:",
                    latitude
                );

                console.log(
                    "Longitude:",
                    longitude
                );

                console.log(
                    "Accuracy:",
                    position.coords.accuracy
                );

                console.log(
                    "Scan ID:",
                    scanId
                );

                console.log(
                    "================================"
                );


                /*
                 * =================================================
                 * ACTUALIZAR LA MISMA FILA
                 * =================================================
                 *
                 * El mismo scanId utilizado
                 * durante el registro inicial.
                 */

                actualizarUbicacion(
                    latitude,
                    longitude
                );


                /*
                 * =================================================
                 * MOSTRAR COORDENADAS
                 * =================================================
                 */

                coordinatesElement.style.display =
                    "block";


                coordinatesElement.innerHTML =
                    "📍 Ubicación detectada<br><br>" +

                    latitude.toFixed(6) +
                    ", " +
                    longitude.toFixed(6);


                /*
                 * =================================================
                 * ESTADO
                 * =================================================
                 */

                statusElement.innerHTML =
                    "✅ Ubicación obtenida correctamente.";


                /*
                 * =================================================
                 * WHATSAPP
                 * =================================================
                 */

                whatsappButton.disabled =
                    false;

            },


            /*
             * ====================================================
             * ERROR GPS
             * ====================================================
             */

            function(error) {


                let mensaje;


                switch (
                    error.code
                ) {


                    case error.PERMISSION_DENIED:

                        mensaje =
                            "❌ Necesitamos permiso para obtener tu ubicación.";

                        break;


                    case error.POSITION_UNAVAILABLE:

                        mensaje =
                            "❌ No fue posible obtener tu ubicación.";

                        break;


                    case error.TIMEOUT:

                        mensaje =
                            "⏱️ La ubicación tardó demasiado.";

                        break;


                    default:

                        mensaje =
                            "❌ No fue posible obtener tu ubicación.";

                }


                mostrarError(
                    mensaje
                );

            },


            /*
             * ====================================================
             * OPCIONES GPS
             * ====================================================
             */

            {

                enableHighAccuracy:
                    true,

                timeout:
                    15000,

                maximumAge:
                    0

            }

        );

    }


    /*
     * ============================================================
     * ERROR GPS
     * ============================================================
     */

    function mostrarError(
        mensaje
    ) {


        statusElement.innerHTML =
            mensaje;


        /*
         * Permitimos WhatsApp aunque
         * no haya GPS.
         */

        whatsappButton.disabled =
            false;


        retryButton.style.display =
            "block";

    }


    /*
     * ============================================================
     * WHATSAPP
     * ============================================================
     */

    function abrirWhatsApp() {


        let mensaje =
            BASE_MESSAGE;


        /*
         * Si tenemos GPS,
         * incluimos la ubicación.
         */

        if (
            latitude !== null &&
            longitude !== null
        ) {


            const mapsURL =
                "https://maps.google.com/?q=" +
                latitude +
                "," +
                longitude;


            mensaje +=
                "\n\n📍 Mi ubicación actual:\n" +
                mapsURL;

        }


        /*
         * Información adicional.
         */

        mensaje +=
            "\n\n🏷️ NFC: " +
            tagId;


        /*
         * Convertir mensaje.
         */

        const encodedMessage =
            encodeURIComponent(
                mensaje
            );


        /*
         * URL WhatsApp.
         */

        const whatsappURL =
            "https://wa.me/" +
            WHATSAPP_NUMBER +
            "?text=" +
            encodedMessage;


        /*
         * Abrir WhatsApp.
         */

        window.location.href =
            whatsappURL;

    }


    /*
     * ============================================================
     * EVENTO WHATSAPP
     * ============================================================
     */

    whatsappButton.addEventListener(
        "click",
        abrirWhatsApp
    );


    /*
     * ============================================================
     * REINTENTAR GPS
     * ============================================================
     */

    retryButton.addEventListener(
        "click",
        function() {


            latitude =
                null;


            longitude =
                null;


            whatsappButton.disabled =
                true;


            coordinatesElement.style.display =
                "none";


            obtenerUbicacion();

        }
    );


    /*
     * ============================================================
     * INICIO
     * ============================================================
     *
     * 1. Se genera scanId.
     *
     * 2. Se registra el escaneo.
     *
     * 3. Se solicita GPS.
     *
     * 4. Cuando llega GPS, se actualiza
     *    la MISMA fila mediante scan_id.
     *
     * ============================================================
     */

    console.log(
        "================================"
    );

    console.log(
        "INICIO PÁGINA DJI NEO 2"
    );

    console.log(
        "NFC ID:",
        tagId
    );

    console.log(
        "SCAN ID:",
        scanId
    );

    console.log(
        "================================"
    );


    registrarEscaneo();


    obtenerUbicacion();


</script>

</body>
</html>
